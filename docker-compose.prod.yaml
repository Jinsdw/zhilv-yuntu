# ============================================
# 智旅云图 - 生产环境编排（服务器专用，独立文件）
# ============================================
# 用法（在项目根目录、.env 配置完成后执行）:
#   docker compose -f docker-compose.prod.yaml up -d --build backend redis
#
# 与开发版 docker-compose.yaml 的差异:
#   - 后端端口只绑定 127.0.0.1:8000，由 Nginx 反代，不直接暴露公网
#   - Redis 不对外映射端口，仅容器内部网络使用（CACHE_ENABLED=false 时基本闲置）
#   - 代码目录 ./backend 直接挂载 /app：改代码重启容器即可生效，改依赖需重新 build
#   - 日志写入 /app/logs/app.log（宿主机 backend/logs/app.log），由 LOG_FILE_PATH 指定
#   - DEBUG / CORS_ORIGINS 通过 .env 传入，生产环境请设 DEBUG=false

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhilv-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DEBUG=${DEBUG:-false}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-4.6v-FlashX}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL}
      - RERANK_MODEL=${RERANK_MODEL}
      - AMAP_API_KEY=${AMAP_API_KEY}
      - CHROMA_DB_PATH=/app/chroma_db
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/trips.db}
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
      - GUIDE_DOCS_PATH=/app/data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE_PATH=/app/logs/app.log
      # 留空=允许所有来源（同源反代下安全）；生产建议在 .env 填 https://你的域名
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      # 代码目录：改代码重启即可生效；改 requirements 后需重新 build
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - zhilv-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: zhilv-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - zhilv-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
    driver: local

networks:
  zhilv-network:
    driver: bridge
