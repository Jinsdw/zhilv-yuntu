# ============================================
# 智旅云图 - Nginx 站点配置（宝塔面板）
# ============================================
# 使用方式：
#   1. 宝塔 → 网站 → 添加站点：域名填你的域名，PHP 版本选「纯静态」
#   2. 网站 → 设置 → 配置文件，把下方 server 块整体粘贴进去（替换自动生成内容）
#   3. 把 server_name、root、日志路径改成你的实际值，保存后「重载」Nginx
#   4. HTTPS：宝塔 → SSL 申请证书并开启强制 HTTPS，宝塔会自动改写本配置

server {
    listen 80;
    listen 443 ssl http2;
    server_name zhilv.example.com;      # ← 改成你的域名

    index index.html index.htm;
    root /www/wwwroot/zhilv/frontend/dist;   # ← 改成你的站点根目录（前端构建产物）

    # 上传大小限制（行程请求体一般很小，10m 足够）
    client_max_body_size 10m;

    # SSL 证书（在宝塔 SSL 面板申请后会自动填入，无需手动修改）
    # ssl_certificate     /www/server/panel/vhost/cert/zhilv.example.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/zhilv.example.com/privkey.pem;

    # 静态资源缓存（构建产物带 hash，可放心缓存 7 天）
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 前端 SPA 路由回退：刷新 /history 等路径时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反向代理（FastAPI 只监听 127.0.0.1:8000）
    location ~ ^/(trip|weather|export|health)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;   # 行程生成走 LLM，耗时较长，必须放宽
        proxy_send_timeout 300s;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    access_log /www/wwwlogs/zhilv.example.com.log;
    error_log  /www/wwwlogs/zhilv.example.com.error.log;
}
